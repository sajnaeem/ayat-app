<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Munib · Live</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .spin { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; border: 3px solid rgba(255,255,255,.25); border-top-color: #fff; border-radius: 50%; animation: r 0.9s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  p { color: #fff; font: 15px/1.5 -apple-system, system-ui, sans-serif; text-align: center; margin: 0; padding: 0 24px; position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); }
</style>
</head>
<body>
<div class="spin"></div>
<!--
  Munib's Live TV player: the broadcasters' official YouTube live streams in YouTube's own embedded player
  (the allowed way to show them). Only the two channels below can be played here. Used by the app's Watch screen.
-->
<script>
  var CHANNELS = {
    makkah: 'UCos52azQNBgW63_9uDJoPDA',   // KSA Qur'an TV (Saudi Broadcasting Authority), Masjid al-Haram
    madinah: 'UCROKYPep-UuODNwyipe6JMw'   // Sunnah TV (Saudi Broadcasting Authority), Masjid an-Nabawi
  };
  var P = new URLSearchParams(location.search);
  var c = P.get('c');
  var id = CHANNELS[c];
  // The app looks up which video the channel has on air and passes it here (v); YouTube's own "the channel's live
  // stream" address (the fallback below) answers "This video is unavailable" for these channels (Nov 2026).
  var v = /^[\w-]{11}$/.test(P.get('v') || '') ? P.get('v') : null;
  var q = 'autoplay=1&mute=0&playsinline=1&rel=0&modestbranding=1';
  if (!id) {
    document.body.innerHTML = '<p>This stream isn’t available.</p>';
  } else if (P.get('off')) {
    document.body.innerHTML = '<p>This broadcast isn’t on air on YouTube at the moment.<br>Please try again in a little while.</p>';
  } else {
    var f = document.createElement('iframe');
    f.src = v ? 'https://www.youtube.com/embed/' + v + '?' + q : 'https://www.youtube.com/embed/live_stream?channel=' + id + '&' + q;
    f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    f.allowFullscreen = true;
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    f.title = 'Live';
    document.body.appendChild(f);
  }
</script>
</body>
</html>
