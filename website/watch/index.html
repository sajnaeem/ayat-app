<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Munib · Live</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .spin { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; border: 3px solid rgba(255,255,255,.25); border-top-color: #fff; border-radius: 50%; animation: r 0.9s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  p { color: #fff; font: 15px -apple-system, system-ui, sans-serif; text-align: center; margin-top: 40vh; }
</style>
</head>
<body>
<div class="spin"></div>
<!--
  Munib's Live TV player: the broadcasters' official YouTube live streams in YouTube's own embedded player
  (the allowed way to show them). Only the two channels below can be played here. Used by the app's Watch screen.
-->
<script>
  var CHANNELS = {
    makkah: 'UCos52azQNBgW63_9uDJoPDA',   // KSA Qur'an TV (Saudi Broadcasting Authority), Masjid al-Haram
    madinah: 'UCROKYPep-UuODNwyipe6JMw'   // Sunnah TV (Saudi Broadcasting Authority), Masjid an-Nabawi
  };
  var c = new URLSearchParams(location.search).get('c');
  var id = CHANNELS[c];
  if (!id) {
    document.body.innerHTML = '<p>This stream isn’t available.</p>';
  } else {
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube.com/embed/live_stream?channel=' + id + '&autoplay=1&mute=0&playsinline=1&rel=0&modestbranding=1';
    f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    f.allowFullscreen = true;
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    f.title = 'Live';
    document.body.appendChild(f);
  }
</script>
</body>
</html>
